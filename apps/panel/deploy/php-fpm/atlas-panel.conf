; PHP-FPM pool for the panel itself.
;
; The panel runs as the unprivileged `atlas` user. It cannot read /etc/shadow,
; cannot write /home, and can only act on the machine through the agent socket.

[atlas-panel]
user = atlas
group = atlas

listen = /run/php/atlas-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; The panel needs to read its own release directory and storage.
chdir = /opt/atlas/current
php_admin_value[open_basedir] = /opt/atlas:/tmp:/run/atlas
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/atlas/php-panel.error.log

; Session isolation: the panel never shares session files with a website.
php_admin_value[session.save_path] = /var/lib/atlas/sessions

; No mail from the panel process; it talks to Postfix on localhost if needed.
php_admin_value[sendmail_path] = /usr/sbin/sendmail -t -i

; Sodium is required for licence verification.
; (enabled by default in Ubuntu's php8.3 packages)
